version: "3.3"
services: 
  openrouteservice:
    container_name: openrouteservice
    restart: always
    ports:
      - "8081:8080"
      - "9001:9001"
    image: openrouteservice/openrouteservice:latest
    user: "${UID:-0}:${GID:-0}"
    volumes:
      - ./openrouteservice/graphs:/home/ors/ors-core/data/graphs
      - ./openrouteservice/elevation_cache:/home/ors/ors-core/data/elevation_cache
      - ./openrouteservice/logs/ors:/home/ors/ors-core/logs/ors
      - ./openrouteservice/logs/tomcat:/home/ors/tomcat/logs
      - ./openrouteservice/conf:/home/ors/ors-conf
      - ./openrouteservice/data/spain-latest.osm.pbf:/home/ors/ors-core/data/osm_file.pbf

    environment:
      - BUILD_GRAPHS=true  # Forces the container to rebuild the graphs, e.g. when PBF is changed
      - "JAVA_OPTS=-Djava.awt.headless=true -server -XX:TargetSurvivorRatio=75 -XX:SurvivorRatio=64 -XX:MaxTenuringThreshold=3 -XX:+UseG1GC -XX:+ScavengeBeforeFullGC -XX:ParallelGCThreads=4 -Xms1g -Xmx4g"
      - "CATALINA_OPTS=-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9001 -Dcom.sun.management.jmxremote.rmi.port=9001 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost"

  opentopodata:
    container_name: opentopodata
    restart: always
    build: "./opentopodata"
    ports:
      - "5000:5000"
    volumes:
      - ./opentopodata/data:/app/data:ro

  nominatim:
    container_name: nominatim
    image: mediagis/nominatim:4.2
    restart: always
    ports:
        - "8082:8080"
    environment:
        - PBF_PATH=/data/spain-latest.osm.pbf
        - NOMINATIM_PASSWORD=very_secure_password
        - REVERSE_ONLY=true
        - THREADS=32
    volumes:
        - ./nominatim/nominatim-data:/var/lib/postgresql/14/main
        - ./openrouteservice/data:/data
    shm_size: 4gb

  mysql:
    image: mysql:8.0
    container_name: mysql
    volumes:
      - ./mysql/data:/var/lib/mysql # mount the host folder here
      - ./mysql/scripts/script.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: greta_app
    networks:
      net:
        ipv4_address: 172.22.0.4
  osrm-backend:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm
    ports:
      - "5002:5000"
    volumes:
      - ./opensourceroutingmachine/data:/data
    command: >
      bash -c "osrm-routed --algorithm mld /data/spain-latest.osrm"

networks:
  net:
    driver: bridge
    ipam:
     config:
       - subnet: 172.22.0.0/16
